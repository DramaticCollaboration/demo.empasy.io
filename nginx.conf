server {
    listen 80;
    server_name demo.empasy.io sync.empasy.io localhost _;

    root /usr/share/nginx/html;
    index index.html;
    sendfile on;
    tcp_nopush on;

    location = /ko {
        return 301 /;
    }

    location ~ ^/ko/(.*)$ {
        return 301 /$1;
    }

    location = /en {
        return 301 /en/;
    }

    location = /ja {
        return 301 /ja/;
    }

    location /downloads/ {
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    location /data/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /assets/css/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt|naver[a-z0-9]+\.html)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~ ^/(index\.html|(en|ja)/(index\.html)?|(en|ja)?/?(guide|products/[a-z0-9-]+)/?(index\.html)?)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri ${uri}index.html $uri/index.html /index.html;
    }

    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}
